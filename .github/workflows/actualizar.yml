name: 📊 Actualizar Dashboard

on:
  push:
    paths:
      - 'data/**.xlsx'
      - 'data/**.xls'
  workflow_dispatch:

jobs:
  procesar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: pip install pandas openpyxl xlrd --quiet

      - name: 🔍 Verificar archivo Excel
        run: |
          python -c "
          from pathlib import Path
          excels = list(Path('data').glob('*.xlsx')) + list(Path('data').glob('*.xls'))
          if not excels:
              print('❌ No se encontró Excel en data/')
              exit(1)
          f = excels[0]
          print(f'✓ {f.name} ({f.stat().st_size/1024:.0f} KB)')
          "

      - name: ⚙️ Procesar Excel → data.json
        run: python scripts/procesar_datos.py

      - name: 📤 Subir data.json al repositorio
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "📊 Datos actualizados $(date +'%d/%m/%Y %H:%M')"
          git push
